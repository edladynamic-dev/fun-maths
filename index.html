<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUN MATHS!</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    background: linear-gradient(135deg, #74ebd5, #ACB6E5);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 15px;
  }
  .card {
    background: #fffdf5;
    border-radius: 24px;
    padding: 28px 22px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    text-align: center;
    max-width: 500px;
    width: 100%;
  }
  h1 {
    color: #d81b60;
    font-size: 32px;
    margin: 0 0 5px;
    text-shadow: 2px 2px 0 #ffd54f;
  }
  h2 { color: #2d5a27; margin: 5px 0 15px; }
  p.sub { color: #666; margin-top: 0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 18px 0;
  }
  .grid button, .cat-btn {
    font-size: 15px;
    padding: 14px 6px;
    border: none;
    border-radius: 14px;
    background: #4fc3f7;
    color: white;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
  }
  .grid button:hover, .cat-btn:hover { transform: scale(1.05); }
  .cat-add { background: #66bb6a; }
  .cat-subs { background: #ffa726; }
  .cat-mult { background: #ab47bc; }
  .cat-div { background: #ef5350; }
  #animal { font-size: 55px; margin: 8px 0; }
  #question { font-size: 28px; font-weight: bold; color: #333; margin: 12px 0; }
  input {
    font-size: 22px;
    padding: 8px;
    width: 100px;
    text-align: center;
    border-radius: 10px;
    border: 2px solid #4fc3f7;
  }
  button.submit, button.small-btn {
    font-size: 17px;
    padding: 10px 20px;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    background: #ff9800;
    color: white;
    cursor: pointer;
  }
  button.small-btn { background: #78909c; font-size: 14px; padding: 8px 14px; }
  button.submit:hover { background: #e68900; }
  #feedback { font-size: 17px; height: 24px; margin-top: 8px; font-weight: bold; }
  #progress-bar {
    height: 12px;
    background: #ddd;
    border-radius: 6px;
    overflow: hidden;
    margin: 10px 0;
  }
  #progress-fill {
    height: 100%;
    background: #66bb6a;
    width: 0%;
    transition: width 0.3s;
  }
  #timer-bar {
    height: 8px;
    background: #eee;
    border-radius: 4px;
    overflow: hidden;
    margin: 8px 0;
  }
  #timer-fill {
    height: 100%;
    background: #ff7043;
    width: 100%;
    transition: width 1s linear;
  }
  .info { font-size: 14px; color: #555; margin: 3px 0; }
  .back-link {
    display: inline-block;
    margin-top: 14px;
    color: #888;
    cursor: pointer;
    font-size: 13px;
    text-decoration: underline;
  }
  .badge {
    display: inline-block;
    background: #ffd54f;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 13px;
    margin-top: 6px;
  }
  .stars { font-size: 34px; margin: 10px 0; }
  table.dash {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 10px;
  }
  table.dash th, table.dash td {
    border: 1px solid #ddd;
    padding: 5px;
    text-align: center;
  }
  table.dash th { background: #eceff1; }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #999;
    margin-bottom: 6px;
  }
  .top-bar span { cursor: pointer; text-decoration: underline; }
  .profile-pill {
    background: #e1f5fe;
    color: #0277bd;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: bold;
    text-decoration: none !important;
  }
  .profile-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 18px 0;
  }
  .profile-btn {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f1f8e9;
    border: 2px solid #aed581;
    border-radius: 14px;
    padding: 12px 16px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    color: #33691e;
  }
  .profile-btn:hover { background: #dcedc8; }
  .profile-icon { font-size: 26px; margin-right: 10px; }
  .del-btn {
    background: #ef5350;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 12px;
    cursor: pointer;
  }
  .new-profile-box {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .new-profile-box input {
    flex: 1;
    width: auto;
    font-size: 16px;
  }
  @media print {
    body { background: white; }
    .card { box-shadow: none; max-width: 100%; }
    .top-bar, .back-link, .small-btn, .no-print { display: none !important; }
    table.dash th { background: #eee !important; -webkit-print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="card" id="app"></div>

<script>
// ---------- CONFIG ----------
const levels = [
  { id: 1, age: "7", label: "Level 1 (Age 7)", range: 10 },
  { id: 2, age: "8", label: "Level 2 (Age 8)", range: 15 },
  { id: 3, age: "9", label: "Level 3 (Age 9)", range: 25 },
  { id: 4, age: "10", label: "Level 4 (Age 10)", range: 40 },
  { id: 5, age: "11", label: "Level 5 (Age 11)", range: 60 },
  { id: 6, age: "12", label: "Level 6 (Age 12)", range: 100 },
];

const categories = [
  { key: "ADD", label: "➕ ADD", cls: "cat-add" },
  { key: "SUBS", label: "➖ SUBS", cls: "cat-subs" },
  { key: "MULTIPLY", label: "✖️ MULTIPLY", cls: "cat-mult" },
  { key: "DIVISION", label: "➗ DIVISION", cls: "cat-div" },
];

const themeSets = {
  animals: ["🐵","🐶","🐱","🦁","🐘","🐼","🦊","🐸","🐰","🦉"],
  ocean: ["🐬","🐳","🐠","🦀","🐙","🐟","🦈","🐢","🦑","⭐"],
  space: ["🚀","🪐","🌟","👽","🛸","🌙","☄️","🌌","🛰️","👨‍🚀"],
  fruits: ["🍎","🍌","🍇","🍓","🍉","🍍","🥝","🍑","🍒","🥭"]
};
const allThemeEmojis = Object.values(themeSets).flat();

const QUESTIONS_PER_CATEGORY = 10;
const TIME_PER_QUESTION = 15; // seconds

// ---------- SOUND (Web Audio API - no external files needed) ----------
let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function beep(freq, duration, type = "sine") {
  try {
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}
function playCorrect() { beep(880, 0.15); setTimeout(() => beep(1175, 0.2), 120); }
function playWrong() { beep(180, 0.35, "sawtooth"); }
function playLevelUp() { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.2),i*150)); }

// ---------- STORAGE (Multi-Profile + Parent Dashboard persistence) ----------
const STORAGE_KEY = "funMathsData";
const PROFILE_ICONS = ["🦁","🐼","🦊","🐸","🐰","🦉","🐬","🚀","🦄","🐯"];

function loadData() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (data && data.profiles) return data;
  } catch(e) {}
  return { profiles: [], progress: {}, lastProfileId: null };
}
function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
}
function loadProgress(profileId) {
  const data = loadData();
  return data.progress[profileId] || {};
}
function saveProgress(profileId, catProgress) {
  const data = loadData();
  data.progress[profileId] = catProgress;
  saveData(data);
}

// ---------- STATE ----------
let state = {
  screen: "profiles",
  profileId: null,
  profileName: null,
  levelId: null,
  category: null,
  questionIndex: 0,
  score: 0,
  correctCount: 0,
  currentAnswer: null,
  completedCategories: {},
  timeLeft: TIME_PER_QUESTION,
  timerInterval: null,
};

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randomEmoji() { return allThemeEmojis[randInt(0, allThemeEmojis.length - 1)]; }

// ---------- QUESTION GENERATION ----------
function generateQuestion(levelId, category) {
  const lvl = levels.find(l => l.id === levelId);
  const range = lvl.range;
  let a, b, answer, text;

  if (category === "ADD") {
    a = randInt(1, range); b = randInt(1, range);
    answer = a + b; text = `${a} + ${b}`;
  } else if (category === "SUBS") {
    a = randInt(1, range); b = randInt(1, a);
    answer = a - b; text = `${a} - ${b}`;
  } else if (category === "MULTIPLY") {
    const capMax = Math.min(3 + levelId * 2, 12);
    a = randInt(1, capMax); b = randInt(1, capMax);
    answer = a * b; text = `${a} × ${b}`;
  } else {
    const capMax = Math.min(3 + levelId * 2, 12);
    b = randInt(1, capMax);
    answer = randInt(1, capMax);
    a = b * answer;
    text = `${a} ÷ ${b}`;
  }
  return { text, answer };
}

function starsForResult(correctCount, total) {
  const pct = correctCount / total;
  if (pct >= 0.9) return 3;
  if (pct >= 0.6) return 2;
  if (pct >= 0.3) return 1;
  return 0;
}

// ---------- RENDER ----------
function render() {
  const app = document.getElementById("app");

  if (state.screen === "profiles") {
    const data = loadData();
    app.innerHTML = `
      <h1>🎉 FUN MATHS! 🎉</h1>
      <p class="sub">Who's playing today?</p>
      <div class="profile-list">
        ${data.profiles.map(p => `
          <div class="profile-btn" onclick="selectProfile('${p.id}')">
            <span><span class="profile-icon">${p.icon}</span>${p.name}</span>
            <button class="del-btn" onclick="event.stopPropagation(); deleteProfile('${p.id}')">✕</button>
          </div>
        `).join("") || `<p>No profiles yet — add one below to get started!</p>`}
      </div>
      <div class="new-profile-box">
        <input type="text" id="newProfileName" placeholder="Enter child's name" maxlength="16">
        <button class="submit" onclick="addProfile()">➕ Add</button>
      </div>
    `;
    const nameInput = document.getElementById("newProfileName");
    if (nameInput) nameInput.addEventListener("keyup", e => { if (e.key === "Enter") addProfile(); });
  }

  else if (state.screen === "start") {
    app.innerHTML = `
      <div class="top-bar">
        <span class="profile-pill" onclick="goToProfiles()">👤 ${state.profileName} (switch)</span>
        <span onclick="goToDashboard()">📊 Dashboard</span>
      </div>
      <h1>🎉 FUN MATHS! 🎉</h1>
      <p class="sub">Pick your level to begin the adventure</p>
      <div class="grid">
        ${levels.map(l => `<button onclick="selectLevel(${l.id})">${l.label}</button>`).join("")}
      </div>
    `;
  }

  else if (state.screen === "category") {
    const lvl = levels.find(l => l.id === state.levelId);
    const completed = state.completedCategories[state.levelId] || {};
    app.innerHTML = `
      <h2>${lvl.label}</h2>
      <p class="sub">Choose a category to practice (10 questions each)</p>
      <div class="grid">
        ${categories.map(c => {
          const stars = completed[c.key] ? completed[c.key].stars : null;
          return `<button class="cat-btn ${c.cls}" onclick="selectCategory('${c.key}')">
            ${c.label}<br>${stars !== null ? "⭐".repeat(stars) + "☆".repeat(3-stars) : ""}
          </button>`;
        }).join("")}
      </div>
      <div class="back-link" onclick="goHome()">⬅ Back to Levels</div>
    `;
  }

  else if (state.screen === "play") {
    const lvl = levels.find(l => l.id === state.levelId);
    const cat = categories.find(c => c.key === state.category);
    const q = generateQuestion(state.levelId, state.category);
    state.currentAnswer = q.answer;
    state.timeLeft = TIME_PER_QUESTION;

    app.innerHTML = `
      <h2>${cat.label} · ${lvl.label}</h2>
      <div class="info">Question ${state.questionIndex + 1} of ${QUESTIONS_PER_CATEGORY}</div>
      <div id="progress-bar"><div id="progress-fill" style="width:${(state.questionIndex/QUESTIONS_PER_CATEGORY)*100}%"></div></div>
      <div id="timer-bar"><div id="timer-fill" style="width:100%"></div></div>
      <div id="animal">${randomEmoji()}</div>
      <div id="question">${q.text} = ?</div>
      <input type="number" id="answer" autofocus>
      <button class="submit" onclick="checkAnswer(false)">Submit</button>
      <div id="feedback"></div>
      <div class="info">Score: ${state.score} | ✅ ${state.correctCount}/${state.questionIndex}</div>
      <div class="back-link" onclick="stopTimer(); goToCategoryScreen();">⬅ Back to Categories</div>
    `;
    const input = document.getElementById("answer");
    input.addEventListener("keyup", e => { if (e.key === "Enter") checkAnswer(false); });
    input.focus();
    startTimer();
  }

  else if (state.screen === "catComplete") {
    const lvl = levels.find(l => l.id === state.levelId);
    const cat = categories.find(c => c.key === state.category);
    const stars = state.completedCategories[state.levelId][state.category].stars;
    app.innerHTML = `
      <h2>🌟 ${cat.label} Complete! 🌟</h2>
      <div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
      <p>${lvl.label} — ${state.correctCount}/${QUESTIONS_PER_CATEGORY} correct</p>
      <div class="badge">Score: ${state.score}</div>
      <br><button class="submit" onclick="goToCategoryScreen()">Continue</button>
    `;
  }

  else if (state.screen === "levelComplete") {
    const lvl = levels.find(l => l.id === state.levelId);
    app.innerHTML = `
      <h2>🏆 ${lvl.label} Mastered! 🏆</h2>
      <div id="animal">🎉🐾🎉</div>
      <p>You finished ADD, SUBS, MULTIPLY & DIVISION!</p>
      <div class="badge">Total Score: ${state.score}</div>
      <br>
      ${state.levelId < 6
        ? `<button class="submit" onclick="selectLevel(${state.levelId + 1})">Next Level ➡</button>`
        : `<button class="submit" onclick="goHome()">🎉 You beat FUN MATHS! 🎉</button>`}
      <div class="back-link" onclick="goHome()">⬅ Back to Levels</div>
    `;
  }

  else if (state.screen === "dashboard") {
    const data = loadData();
    app.innerHTML = renderDashboardHTML(data, state.profileId);
  }
}

function renderDashboardHTML(data, filterProfileId) {
  const profilesToShow = filterProfileId
    ? data.profiles.filter(p => p.id === filterProfileId)
    : data.profiles;

  let sections = "";
  profilesToShow.forEach(p => {
    const progress = data.progress[p.id] || {};
    let rows = "";
    levels.forEach(l => {
      categories.forEach(c => {
        const rec = progress[`${l.id}-${c.key}`];
        if (rec) {
          rows += `<tr>
            <td>${l.label}</td><td>${c.label}</td>
            <td>${"⭐".repeat(rec.stars)}${"☆".repeat(3-rec.stars)}</td>
            <td>${rec.best}/${QUESTIONS_PER_CATEGORY}</td>
            <td>${rec.attempts}</td>
            <td>${new Date(rec.lastPlayed).toLocaleDateString()}</td>
          </tr>`;
        }
      });
    });
    sections += `
      <h3>${p.icon} ${p.name}</h3>
      ${rows ? `<table class="dash">
        <tr><th>Level</th><th>Category</th><th>Stars</th><th>Best</th><th>Attempts</th><th>Last Played</th></tr>
        ${rows}
      </table>` : `<p>No activity yet.</p>`}
    `;
  });

  return `
    <h2>📊 Parent Dashboard</h2>
    <p class="sub">Progress saved on this device/browser</p>
    ${sections || `<p>No profiles yet.</p>`}
    <br>
    <button class="small-btn no-print" onclick="window.print()">🖨️ Print Report</button>
    ${state.profileId ? `<button class="small-btn no-print" onclick="clearProgress()">Reset ${state.profileName}'s Progress</button>` : ""}
    <div class="back-link no-print" onclick="goHome()">⬅ Back to Levels</div>
  `;
}

// ---------- TIMER ----------
function startTimer() {
  stopTimer();
  state.timerInterval = setInterval(() => {
    state.timeLeft--;
    const fill = document.getElementById("timer-fill");
    if (fill) fill.style.width = `${(state.timeLeft / TIME_PER_QUESTION) * 100}%`;
    if (state.timeLeft <= 0) {
      stopTimer();
      checkAnswer(true);
    }
  }, 1000);
}
function stopTimer() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = null;
}

// ---------- ACTIONS ----------
function selectLevel(id) {
  state.levelId = id;
  state.screen = "category";
  render();
}
function selectCategory(key) {
  state.category = key;
  state.questionIndex = 0;
  state.score = 0;
  state.correctCount = 0;
  state.screen = "play";
  render();
}
function goToCategoryScreen() { state.screen = "category"; render(); }
function goHome() { state.screen = "start"; state.levelId = null; state.category = null; render(); }
function goToDashboard() { state.screen = "dashboard"; render(); }
function goToProfiles() { state.screen = "profiles"; render(); }

function addProfile() {
  const input = document.getElementById("newProfileName");
  const name = input.value.trim();
  if (!name) return;
  const data = loadData();
  const icon = PROFILE_ICONS[data.profiles.length % PROFILE_ICONS.length];
  const id = "p_" + Date.now();
  data.profiles.push({ id, name, icon });
  data.progress[id] = {};
  saveData(data);
  selectProfile(id);
}

function deleteProfile(id) {
  const data = loadData();
  data.profiles = data.profiles.filter(p => p.id !== id);
  delete data.progress[id];
  if (data.lastProfileId === id) data.lastProfileId = null;
  saveData(data);
  render();
}

function selectProfile(id) {
  const data = loadData();
  const profile = data.profiles.find(p => p.id === id);
  if (!profile) return;
  data.lastProfileId = id;
  saveData(data);

  state.profileId = id;
  state.profileName = profile.name;
  state.completedCategories = {};
  const progress = loadProgress(id);
  Object.keys(progress).forEach(key => {
    const [lvlId, cat] = key.split("-");
    if (!state.completedCategories[lvlId]) state.completedCategories[lvlId] = {};
    state.completedCategories[lvlId][cat] = { stars: progress[key].stars, best: progress[key].best };
  });

  state.screen = "start";
  render();
}

function clearProgress() {
  saveProgress(state.profileId, {});
  state.completedCategories = {};
  render();
}

function checkAnswer(timedOut) {
  stopTimer();
  const input = document.getElementById("answer");
  const userAnswer = input ? parseInt(input.value) : NaN;
  const feedback = document.getElementById("feedback");

  if (!timedOut && userAnswer === state.currentAnswer) {
    state.score += 10;
    state.correctCount++;
    if (feedback) { feedback.textContent = "🎉 Correct!"; feedback.style.color = "#2d5a27"; }
    playCorrect();
  } else {
    if (feedback) {
      feedback.textContent = timedOut ? `⏰ Time's up! Answer: ${state.currentAnswer}` : `❌ Answer: ${state.currentAnswer}`;
      feedback.style.color = "#c0392b";
    }
    playWrong();
  }

  state.questionIndex++;

  setTimeout(() => {
    if (state.questionIndex >= QUESTIONS_PER_CATEGORY) {
      const stars = starsForResult(state.correctCount, QUESTIONS_PER_CATEGORY);

      if (!state.completedCategories[state.levelId]) state.completedCategories[state.levelId] = {};
      state.completedCategories[state.levelId][state.category] = { stars, best: state.correctCount };

      const progress = loadProgress(state.profileId);
      const key = `${state.levelId}-${state.category}`;
      const prev = progress[key];
      progress[key] = {
        stars: prev ? Math.max(prev.stars, stars) : stars,
        best: prev ? Math.max(prev.best, state.correctCount) : state.correctCount,
        attempts: prev ? prev.attempts + 1 : 1,
        lastPlayed: Date.now()
      };
      saveProgress(state.profileId, progress);

      const allDone = categories.every(c => state.completedCategories[state.levelId][c.key]);
      if (allDone) playLevelUp();
      state.screen = allDone ? "levelComplete" : "catComplete";
      render();
    } else {
      render();
    }
  }, 1200);
}

// On load: auto-resume last active profile if one exists, else show profile picker
(function initFromStorage() {
  const data = loadData();
  if (data.lastProfileId && data.profiles.find(p => p.id === data.lastProfileId)) {
    selectProfile(data.lastProfileId);
  } else {
    render();
  }
})();
</script>
</body>
</html>
